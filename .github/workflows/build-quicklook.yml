name: Build QuickLook 3.7.3 Custom

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # QuickLook 3.7.3 需要 Windows SDK 20348
      - name: Setup Windows SDK 20348
        uses: GuillaumeFalourd/setup-windows10-sdk-action@v2.5
        with:
          sdk-version: 20348

      # 获取 QuickLook.Common 的正确历史版本
      - name: Restore QuickLook.Common
        shell: powershell
        run: |
          Remove-Item ".\QuickLook.Common" -Recurse -Force -ErrorAction SilentlyContinue

          git clone --depth 1 --branch 3.7.3 `
            https://github.com/QL-Win/QuickLook.git `
            ".\upstream"

          $line = git -C ".\upstream" ls-tree HEAD QuickLook.Common
          $sha = ($line -split '\s+')[2]

          Write-Host "QuickLook.Common commit: $sha"

          git clone https://github.com/QL-Win/QuickLook.Common.git `
            ".\QuickLook.Common"

          git -C ".\QuickLook.Common" fetch origin $sha
          git -C ".\QuickLook.Common" checkout $sha

          Remove-Item ".\upstream" -Recurse -Force

      # 防止没有 Git tag 时 GitVersion.cs 生成错误版本号
      - name: Create GitVersion.cs
        shell: powershell
        run: |
          @"
          using System.Reflection;

          [assembly: AssemblyVersion("3.7.3.0")]
          [assembly: AssemblyFileVersion("3.7.3.0")]
          [assembly: AssemblyInformationalVersion("3.7.3-custom")]
          "@ | Out-File ".\GitVersion.cs" -Encoding utf8

      # NuGet
      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path ".\packages" | Out-Null

          nuget restore ".\QuickLook\QuickLook.csproj" `
            -PackagesDirectory ".\packages" `
            -NonInteractive

      # MSBuild
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # 编译 QuickLook.exe
      - name: Build QuickLook
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force `
            -Path ".\QuickLook\bin\Release" | Out-Null

          msbuild ".\QuickLook\QuickLook.csproj" `
            /t:Build `
            /p:Configuration=Release `
            /p:Platform="AnyCPU" `
            /p:OutputPath="bin\Release\" `
            /p:RestorePackagesPath=".\packages" `
            /m `
            /v:minimal

      # 找到最终 exe
      - name: Check output
        shell: powershell
        run: |
          Get-ChildItem ".\QuickLook\bin\Release" -Recurse -Filter "QuickLook.exe" |
            Select-Object FullName, Length

      # 只上传 QuickLook.exe
      - name: Upload QuickLook.exe
        uses: actions/upload-artifact@v4
        with:
          name: QuickLook-3.7.3-custom
          path: .\QuickLook\bin\Release\QuickLook.exe
          if-no-files-found: error
