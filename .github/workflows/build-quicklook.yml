name: Build QuickLook 3.7.3

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:

      # ============================================================
      # 1. 下载仓库源码
      # ============================================================
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ============================================================
      # 2. 显示当前目录结构，方便排查
      # ============================================================
      - name: Check source
        shell: powershell
        run: |
          Write-Host "Current directory:"
          Get-Location

          Write-Host ""
          Write-Host "Root files:"
          Get-ChildItem

          Write-Host ""
          Write-Host "QuickLook project:"
          Get-ChildItem .\QuickLook


      # ============================================================
      # 3. 下载 QuickLook.Common 子模块
      #
      # 原版 3.7.3 的 QuickLook.Common 是 Git Submodule。
      # 因为我们上传 ZIP 时没有带 .git 子模块信息，
      # 所以这里直接下载它。
      # ============================================================
      - name: Download QuickLook.Common
        shell: powershell
        run: |
          if (Test-Path ".\QuickLook.Common") {
              Remove-Item ".\QuickLook.Common" -Recurse -Force
          }

          git clone --depth 1 `
            https://github.com/QL-Win/QuickLook.Common.git `
            QuickLook.Common

          Write-Host ""
          Write-Host "QuickLook.Common downloaded."

          Get-ChildItem .\QuickLook.Common


      # ============================================================
      # 4. 检查 Windows SDK
      # ============================================================
      - name: Check Windows SDK
        shell: powershell
        run: |
          Write-Host "Windows Kits:"
          Get-ChildItem `
            "C:\Program Files (x86)\Windows Kits\10\Include" `
            -ErrorAction SilentlyContinue

          Write-Host ""
          Write-Host "Reference Assemblies:"
          Get-ChildItem `
            "C:\Program Files (x86)\Windows Kits\10\References" `
            -ErrorAction SilentlyContinue


      # ============================================================
      # 5. 安装 Windows SDK 10.0.20348
      #
      # QuickLook 3.7.3 的 csproj 原本就是按照 20348 写的。
      # 不再把 20348 改成 22621。
      #
      # 如果 runner 已经有 20348，就跳过。
      # ============================================================
      - name: Install Windows SDK 10.0.20348
        shell: powershell
        run: |
          $sdkPath = "C:\Program Files (x86)\Windows Kits\10"

          $sdk20348 = Join-Path `
            $sdkPath `
            "References\10.0.20348.0"

          if (Test-Path $sdk20348) {
              Write-Host "Windows SDK 10.0.20348 is already installed."
              exit 0
          }

          Write-Host "Windows SDK 10.0.20348 not found."

          $installer = "$env:TEMP\winsdksetup.exe"

          Write-Host "Downloading Windows SDK installer..."

          Invoke-WebRequest `
            -Uri "https://go.microsoft.com/fwlink/?linkid=2162611" `
            -OutFile $installer

          Write-Host "Installer downloaded:"
          Get-Item $installer

          Write-Host ""
          Write-Host "Starting Windows SDK installation..."

          Start-Process `
            -FilePath $installer `
            -ArgumentList "/quiet", "/norestart", "/features", "+", "/installpath", "C:\Program Files (x86)\Windows Kits\10" `
            -Wait `
            -PassThru

          Write-Host ""
          Write-Host "Checking SDK after installation..."

          if (-not (Test-Path $sdk20348)) {
              Write-Error "Windows SDK 10.0.20348 was not installed."
              exit 1
          }

          Write-Host "Windows SDK 10.0.20348 installed successfully."


      # ============================================================
      # 6. 检查 20348 的关键 WinMD 文件
      # ============================================================
      - name: Check Windows SDK 20348 files
        shell: powershell
        run: |
          $base = "C:\Program Files (x86)\Windows Kits\10"

          $files = @(
            "$base\UnionMetadata\10.0.20348.0\Facade\windows.winmd",
            "$base\References\10.0.20348.0\Windows.Foundation.FoundationContract\4.0.0.0\Windows.Foundation.FoundationContract.winmd",
            "$base\References\10.0.20348.0\Windows.Foundation.UniversalApiContract\12.0.0.0\Windows.Foundation.UniversalApiContract.winmd"
          )

          foreach ($file in $files) {
              Write-Host ""
              Write-Host "Checking:"
              Write-Host $file

              if (Test-Path $file) {
                  Write-Host "FOUND"
              }
              else {
                  Write-Error "NOT FOUND"
                  exit 1
              }
          }


      # ============================================================
      # 7. 安装 NuGet
      # ============================================================
      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2


      # ============================================================
      # 8. 配置 MSBuild
      # ============================================================
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2


      # ============================================================
      # 9. 生成合法的 GitVersion.cs
      #
      # GitHub Actions checkout 的 commit 是 SHA：
      #
      # 3445eaeb51f7b6884f9065b8bc71d1e67a506132
      #
      # 但 AssemblyVersion 不能直接使用这种字符串。
      #
      # 所以这里给这次自定义版本：
      # 3.7.3.0
      #
      # 不修改你仓库里的源码，只在 Actions 构建环境中生成。
      # ============================================================
      - name: Generate build version
        shell: powershell
        run: |
          $content = @"
          // This file is generated by GitHub Actions
          using System.Reflection;

          [assembly: AssemblyVersion("3.7.3.0")]
          [assembly: AssemblyFileVersion("3.7.3.0")]
          [assembly: AssemblyInformationalVersion("3.7.3-custom")]
          "@

          $content | Out-File `
            ".\GitVersion.cs" `
            -Encoding utf8

          Write-Host ""
          Write-Host "Generated GitVersion.cs:"
          Get-Content ".\GitVersion.cs"


      # ============================================================
      # 10. NuGet restore
      #
      # 这里只恢复 QuickLook 主项目。
      # 不恢复整个 Solution。
      # ============================================================
      - name: Restore QuickLook project
        shell: powershell
        run: |
          nuget restore `
            ".\QuickLook\QuickLook.csproj" `
            -NonInteractive


      # ============================================================
      # 11. 编译 QuickLook
      #
      # 只编译 QuickLook.csproj。
      #
      # 不编译：
      # - Installer
      # - Plugins
      # - 其它不需要的项目
      #
      # 目的就是拿到 QuickLook.exe。
      # ============================================================
      - name: Build QuickLook
        shell: powershell
        run: |
          msbuild ".\QuickLook\QuickLook.csproj" `
            /t:Build `
            /p:Configuration=Release `
            /p:Platform="Any CPU" `
            /p:TargetFrameworkVersion=v4.7.2 `
            /m `
            /v:minimal


      # ============================================================
      # 12. 搜索生成的 QuickLook.exe
      # ============================================================
      - name: Find QuickLook.exe
        shell: powershell
        run: |
          Write-Host "Searching for QuickLook.exe..."

          $files = Get-ChildItem `
            -Path "." `
            -Filter "QuickLook.exe" `
            -Recurse `
            -File `
            -ErrorAction SilentlyContinue

          if ($files.Count -eq 0) {
              Write-Error "QuickLook.exe was not found."
              exit 1
          }

          foreach ($file in $files) {
              Write-Host ""
              Write-Host "FOUND:"
              Write-Host $file.FullName

              Write-Host "Size:"
              Write-Host $file.Length

              Write-Host "Version:"
              try {
                  $version = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($file.FullName)
                  Write-Host $version.FileVersion
              }
              catch {
                  Write-Host "Unable to read file version."
              }
          }


      # ============================================================
      # 13. 单独复制 QuickLook.exe
      #
      # Artifact 中只放这个 EXE。
      # ============================================================
      - name: Prepare QuickLook.exe
        shell: powershell
        run: |
          $source = Get-ChildItem `
            -Path "." `
            -Filter "QuickLook.exe" `
            -Recurse `
            -File |
            Select-Object -First 1

          if ($null -eq $source) {
              Write-Error "QuickLook.exe not found."
              exit 1
          }

          New-Item `
            -ItemType Directory `
            -Force `
            -Path ".\build-output" | Out-Null

          Copy-Item `
            $source.FullName `
            ".\build-output\QuickLook.exe" `
            -Force

          Write-Host ""
          Write-Host "Final output:"
          Get-Item ".\build-output\QuickLook.exe"


      # ============================================================
      # 14. 上传 QuickLook.exe
      # ============================================================
      - name: Upload QuickLook.exe
        uses: actions/upload-artifact@v4
        with:
          name: QuickLook-3.7.3-custom
          path: build-output/QuickLook.exe
          if-no-files-found: error
