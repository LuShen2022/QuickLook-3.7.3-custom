name: Build QuickLook 3.7.3

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:

      # ============================================================
      # 1. 获取源码
      # ============================================================
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ============================================================
      # 2. 下载 QuickLook.Common
      # ============================================================
      - name: Download QuickLook.Common
        shell: powershell
        run: |
          if (Test-Path ".\QuickLook.Common") {
              Remove-Item ".\QuickLook.Common" -Recurse -Force
          }

          git clone --depth 1 `
            https://github.com/QL-Win/QuickLook.Common.git `
            QuickLook.Common

          Write-Host ""
          Write-Host "QuickLook.Common downloaded."


      # ============================================================
      # 3. 安装 Windows SDK 10.0.20348
      #
      # 使用专门的 GitHub Action。
      # 不再自己 Invoke-WebRequest。
      # ============================================================
      - name: Setup Windows SDK 20348
        uses: GuillaumeFalourd/setup-windows10-sdk-action@v2.5
        with:
          sdk-version: 20348


      # ============================================================
      # 4. 检查 Windows SDK
      # ============================================================
      - name: Check Windows SDK
        shell: powershell
        run: |
          $sdkRoot = "C:\Program Files (x86)\Windows Kits\10"

          Write-Host "Installed SDK versions:"
          Get-ChildItem `
            "$sdkRoot\Include" `
            -ErrorAction SilentlyContinue

          Write-Host ""
          Write-Host "Checking 20348..."

          $paths = @(
            "$sdkRoot\Include\10.0.20348.0",
            "$sdkRoot\UnionMetadata\10.0.20348.0",
            "$sdkRoot\References\10.0.20348.0"
          )

          foreach ($path in $paths) {
              if (Test-Path $path) {
                  Write-Host "FOUND: $path"
              }
              else {
                  Write-Error "NOT FOUND: $path"
                  exit 1
              }
          }


      # ============================================================
      # 5. 检查 QuickLook.csproj 中是否仍然使用 20348
      # ============================================================
      - name: Check QuickLook project SDK references
        shell: powershell
        run: |
          Write-Host "Windows SDK references in QuickLook.csproj:"
          Select-String `
            -Path ".\QuickLook\QuickLook.csproj" `
            -Pattern "10\.0\." |
            ForEach-Object {
              Write-Host $_.Line
            }


      # ============================================================
      # 6. Setup NuGet
      # ============================================================
      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2


      # ============================================================
      # 7. Setup MSBuild
      # ============================================================
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2


      # ============================================================
      # 8. 生成 GitVersion.cs
      #
      # 防止 Git SHA 被当成 AssemblyVersion。
      # ============================================================
      - name: Generate build version
        shell: powershell
        run: |
          $content = @"
          // This file is generated by GitHub Actions
          using System.Reflection;

          [assembly: AssemblyVersion("3.7.3.0")]
          [assembly: AssemblyFileVersion("3.7.3.0")]
          [assembly: AssemblyInformationalVersion("3.7.3-custom")]
          "@

          $content | Out-File `
            ".\GitVersion.cs" `
            -Encoding utf8

          Write-Host ""
          Write-Host "GitVersion.cs:"
          Get-Content ".\GitVersion.cs"


      # ============================================================
      # 9. Restore QuickLook
      # ============================================================
      - name: Restore QuickLook
        shell: powershell
        run: |
          nuget restore `
            ".\QuickLook\QuickLook.csproj" `
            -NonInteractive


      # ============================================================
      # 10. 编译 QuickLook
      #
      # 只编译 QuickLook.csproj
      # 不编译整个 QuickLook.sln
      # ============================================================
      - name: Build QuickLook
        shell: powershell
        run: |
          msbuild ".\QuickLook\QuickLook.csproj" `
            /t:Build `
            /p:Configuration=Release `
            /p:Platform="Any CPU" `
            /p:TargetFrameworkVersion=v4.7.2 `
            /m `
            /v:minimal


      # ============================================================
      # 11. 查找 QuickLook.exe
      # ============================================================
      - name: Find QuickLook.exe
        shell: powershell
        run: |
          Write-Host "Searching for QuickLook.exe..."

          $files = Get-ChildItem `
            -Path "." `
            -Filter "QuickLook.exe" `
            -Recurse `
            -File `
            -ErrorAction SilentlyContinue

          if ($files.Count -eq 0) {
              Write-Error "QuickLook.exe was not found."
              exit 1
          }

          foreach ($file in $files) {
              Write-Host ""
              Write-Host "FOUND:"
              Write-Host $file.FullName
              Write-Host "SIZE:"
              Write-Host $file.Length

              $info = [System.Diagnostics.FileVersionInfo]::GetVersionInfo(
                  $file.FullName
              )

              Write-Host "VERSION:"
              Write-Host $info.FileVersion
          }


      # ============================================================
      # 12. 准备最终 EXE
      # ============================================================
      - name: Prepare QuickLook.exe
        shell: powershell
        run: |
          $source = Get-ChildItem `
            -Path "." `
            -Filter "QuickLook.exe" `
            -Recurse `
            -File |
            Select-Object -First 1

          if ($null -eq $source) {
              Write-Error "QuickLook.exe not found."
              exit 1
          }

          New-Item `
            -ItemType Directory `
            -Force `
            -Path ".\build-output" |
            Out-Null

          Copy-Item `
            $source.FullName `
            ".\build-output\QuickLook.exe" `
            -Force

          Write-Host ""
          Write-Host "Final output:"
          Get-Item ".\build-output\QuickLook.exe"


      # ============================================================
      # 13. 上传最终 QuickLook.exe
      # ============================================================
      - name: Upload QuickLook.exe
        uses: actions/upload-artifact@v4
        with:
          name: QuickLook-3.7.3-custom
          path: build-output/QuickLook.exe
          if-no-files-found: error
