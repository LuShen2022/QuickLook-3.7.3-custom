name: Build QuickLook 3.7.3 Custom

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:

      # ============================================================
      # 1. 获取你仓库里的 QuickLook 3.7.3 源码
      # ============================================================
      - name: Checkout source
        uses: actions/checkout@v4


      # ============================================================
      # 2. 安装 QuickLook 3.7.3 所需要的 Windows SDK 20348
      # ============================================================
      - name: Setup Windows SDK 20348
        uses: GuillaumeFalourd/setup-windows10-sdk-action@v2.5
        with:
          sdk-version: 20348


      # ============================================================
      # 3. 恢复 QuickLook 3.7.3 对应的 QuickLook.Common
      #
      # 不能使用最新版 QuickLook.Common。
      # 从官方 3.7.3 的 git tree 中取得准确 commit。
      # ============================================================
      - name: Restore QuickLook.Common
        shell: powershell
        run: |
          Write-Host "Removing existing QuickLook.Common..."

          Remove-Item ".\QuickLook.Common" `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue


          Write-Host "Getting official QuickLook 3.7.3..."

          git clone `
            --depth 1 `
            --branch 3.7.3 `
            https://github.com/QL-Win/QuickLook.git `
            ".\upstream"


          Write-Host "Finding QuickLook.Common commit..."

          $line = git -C ".\upstream" ls-tree HEAD QuickLook.Common

          Write-Host "Git tree entry:"
          Write-Host $line

          $sha = ($line -split '\s+')[2]

          if ([string]::IsNullOrWhiteSpace($sha)) {
            Write-Error "Unable to determine QuickLook.Common commit."
            exit 1
          }

          Write-Host "QuickLook.Common commit:"
          Write-Host $sha


          Write-Host "Cloning QuickLook.Common..."

          git clone `
            https://github.com/QL-Win/QuickLook.Common.git `
            ".\QuickLook.Common"


          Write-Host "Checking out exact commit..."

          git -C ".\QuickLook.Common" fetch origin $sha
          git -C ".\QuickLook.Common" checkout $sha


          Write-Host "QuickLook.Common HEAD:"
          git -C ".\QuickLook.Common" rev-parse HEAD


          Remove-Item ".\upstream" `
            -Recurse `
            -Force


      # ============================================================
      # 4. 固定 QuickLook 版本生成脚本
      #
      # QuickLook.Common.csproj 会在构建时执行：
      #
      #   Scripts\update-version.ps1
      #
      # 原始脚本会使用 git describe。
      # 我们的自建 GitHub 仓库没有官方 3.7.3 tag，
      # 因此会错误地把 Git SHA 当成 AssemblyVersion。
      #
      # 这里直接让脚本固定生成合法的 3.7.3 版本。
      # ============================================================
      - name: Fix version generation script
        shell: powershell
        run: |
          $script = @'
          # QuickLook 3.7.3 custom build
          # Generated by GitHub Actions

          $text = @"
          // This file is generated by update-version.ps1
          using System.Reflection;

          [assembly: AssemblyVersion("3.7.3.0")]
          [assembly: AssemblyFileVersion("3.7.3.0")]
          [assembly: AssemblyInformationalVersion("3.7.3-custom")]
          "@

          $text | Out-File `
            "$PSScriptRoot\..\GitVersion.cs" `
            -Encoding utf8
          '@

          New-Item `
            -ItemType Directory `
            -Force `
            -Path ".\Scripts" |
            Out-Null

          $script | Out-File `
            ".\Scripts\update-version.ps1" `
            -Encoding utf8

          Write-Host "Version script:"
          Get-Content ".\Scripts\update-version.ps1"


      # ============================================================
      # 5. 设置 NuGet
      # ============================================================
      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2


      # ============================================================
      # 6. 准备 packages 目录
      # ============================================================
      - name: Prepare NuGet packages directory
        shell: powershell
        run: |
          New-Item `
            -ItemType Directory `
            -Force `
            -Path ".\packages" |
            Out-Null


      # ============================================================
      # 7. Restore 整个 Solution
      # ============================================================
      - name: Restore NuGet packages
        shell: powershell
        run: |
          nuget restore ".\QuickLook.sln" `
            -PackagesDirectory ".\packages" `
            -NonInteractive


      # ============================================================
      # 8. 安装 MSBuild
      # ============================================================
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2


      # ============================================================
      # 9. 检查环境
      # ============================================================
      - name: Check build environment
        shell: powershell
        run: |
          Write-Host "========================================"
          Write-Host "MSBuild"
          Write-Host "========================================"

          msbuild -version


          Write-Host ""
          Write-Host "========================================"
          Write-Host "Solution"
          Write-Host "========================================"

          Get-Item ".\QuickLook.sln"


          Write-Host ""
          Write-Host "========================================"
          Write-Host "QuickLook.Common commit"
          Write-Host "========================================"

          git -C ".\QuickLook.Common" rev-parse HEAD


          Write-Host ""
          Write-Host "========================================"
          Write-Host "Version script"
          Write-Host "========================================"

          Get-Content ".\Scripts\update-version.ps1"


      # ============================================================
      # 10. 构建整个 Solution
      #
      # 必须使用 QuickLook.sln，而不是 QuickLook.csproj。
      # 这样 $(SolutionDir) 才会正确。
      # ============================================================
      - name: Build QuickLook
        shell: powershell
        run: |
          msbuild ".\QuickLook.sln" `
            /t:Build `
            /p:Configuration=Release `
            /p:Platform="Any CPU" `
            /p:RestorePackagesPath=".\packages" `
            /m `
            /v:minimal


      # ============================================================
      # 11. 查找生成的 QuickLook.exe
      # ============================================================
      - name: Find QuickLook.exe
        shell: powershell
        run: |
          Write-Host "Searching for QuickLook.exe..."

          $files = Get-ChildItem "." `
            -Recurse `
            -Filter "QuickLook.exe" `
            -File

          if ($files.Count -eq 0) {
            Write-Error "QuickLook.exe was not found."
            exit 1
          }

          foreach ($file in $files) {
            Write-Host ""
            Write-Host "Found:"
            Write-Host $file.FullName
            Write-Host "Size:"
            Write-Host $file.Length
          }


      # ============================================================
      # 12. 找到 Release 版本 QuickLook.exe
      # ============================================================
      - name: Prepare artifact
        shell: powershell
        run: |
          $exe = Get-ChildItem "." `
            -Recurse `
            -Filter "QuickLook.exe" `
            -File |
            Where-Object {
              $_.FullName -match "\\Build\\Release\\"
            } |
            Select-Object -First 1

          if ($null -eq $exe) {
            Write-Error "Release QuickLook.exe was not found."
            exit 1
          }

          New-Item `
            -ItemType Directory `
            -Force `
            -Path ".\artifact" |
            Out-Null

          Copy-Item `
            $exe.FullName `
            ".\artifact\QuickLook.exe" `
            -Force

          Write-Host ""
          Write-Host "========================================"
          Write-Host "Final artifact"
          Write-Host "========================================"

          Get-Item ".\artifact\QuickLook.exe"


      # ============================================================
      # 13. 上传最终 QuickLook.exe
      # ============================================================
      - name: Upload QuickLook.exe
        uses: actions/upload-artifact@v4
        with:
          name: QuickLook-3.7.3-custom
          path: .\artifact\QuickLook.exe
          if-no-files-found: error
