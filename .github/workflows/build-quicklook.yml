name: Build QuickLook 3.7.3 Custom

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:

      # ============================================================
      # 1. 获取你 GitHub 仓库里的 QuickLook 3.7.3 源码
      # ============================================================
      - name: Checkout source
        uses: actions/checkout@v4


      # ============================================================
      # 2. 安装 QuickLook 3.7.3 所需要的 Windows SDK 20348
      # ============================================================
      - name: Setup Windows SDK 20348
        uses: GuillaumeFalourd/setup-windows10-sdk-action@v2.5
        with:
          sdk-version: 20348


      # ============================================================
      # 3. 获取 QuickLook 3.7.3 对应版本的 QuickLook.Common
      #
      # 不能直接 clone 最新版 QuickLook.Common，
      # 必须使用 3.7.3 当时对应的 commit。
      # ============================================================
      - name: Restore QuickLook.Common
        shell: powershell
        run: |
          Write-Host "Removing existing QuickLook.Common..."

          Remove-Item ".\QuickLook.Common" `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue


          Write-Host "Getting official QuickLook 3.7.3..."

          git clone `
            --depth 1 `
            --branch 3.7.3 `
            https://github.com/QL-Win/QuickLook.git `
            ".\upstream"


          Write-Host "Finding QuickLook.Common commit..."

          $line = git -C ".\upstream" ls-tree HEAD QuickLook.Common

          Write-Host "Git tree entry:"
          Write-Host $line

          $sha = ($line -split '\s+')[2]

          if ([string]::IsNullOrWhiteSpace($sha)) {
            Write-Error "Unable to determine QuickLook.Common commit."
            exit 1
          }

          Write-Host "QuickLook.Common commit:"
          Write-Host $sha


          Write-Host "Cloning QuickLook.Common..."

          git clone `
            https://github.com/QL-Win/QuickLook.Common.git `
            ".\QuickLook.Common"


          Write-Host "Checking out exact commit..."

          git -C ".\QuickLook.Common" fetch origin $sha
          git -C ".\QuickLook.Common" checkout $sha


          Write-Host "QuickLook.Common HEAD:"
          git -C ".\QuickLook.Common" rev-parse HEAD


          Write-Host "Removing temporary upstream repository..."

          Remove-Item ".\upstream" `
            -Recurse `
            -Force


      # ============================================================
      # 4. 生成 GitVersion.cs
      #
      # 因为我们自己的 GitHub 仓库没有官方 QuickLook 的 tag，
      # 所以不能让 update-version.ps1 根据当前 SHA 生成版本号。
      # ============================================================
      - name: Create GitVersion.cs
        shell: powershell
        run: |
          $content = @"
          // This file is generated by GitHub Actions

          using System.Reflection;

          [assembly: AssemblyVersion("3.7.3.0")]
          [assembly: AssemblyFileVersion("3.7.3.0")]
          [assembly: AssemblyInformationalVersion("3.7.3-custom")]
          "@

          $content | Out-File `
            ".\GitVersion.cs" `
            -Encoding utf8

          Write-Host "GitVersion.cs created."


      # ============================================================
      # 5. 安装 NuGet
      # ============================================================
      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2


      # ============================================================
      # 6. 创建 packages 目录
      # ============================================================
      - name: Prepare NuGet packages directory
        shell: powershell
        run: |
          New-Item `
            -ItemType Directory `
            -Force `
            -Path ".\packages" |
            Out-Null


      # ============================================================
      # 7. Restore Solution
      #
      # 注意：
      # 必须 restore QuickLook.sln，
      # 不要直接 restore QuickLook.csproj。
      # ============================================================
      - name: Restore NuGet packages
        shell: powershell
        run: |
          nuget restore ".\QuickLook.sln" `
            -PackagesDirectory ".\packages" `
            -NonInteractive


      # ============================================================
      # 8. 安装 MSBuild
      # ============================================================
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2


      # ============================================================
      # 9. 显示环境信息
      # ============================================================
      - name: Check build environment
        shell: powershell
        run: |
          Write-Host "=== MSBuild ==="
          msbuild -version

          Write-Host ""
          Write-Host "=== Solution ==="
          Get-Item ".\QuickLook.sln"

          Write-Host ""
          Write-Host "=== QuickLook.Common ==="
          git -C ".\QuickLook.Common" rev-parse HEAD

          Write-Host ""
          Write-Host "=== GitVersion.cs ==="
          Get-Content ".\GitVersion.cs"


      # ============================================================
      # 10. 构建整个 Solution
      #
      # 这里故意使用 QuickLook.sln。
      # 这样 $(SolutionDir) 会正确设置，
      # QuickLook.Common 的 PreBuildEvent 才能找到 Scripts。
      # ============================================================
      - name: Build QuickLook
        shell: powershell
        run: |
          msbuild ".\QuickLook.sln" `
            /t:Build `
            /p:Configuration=Release `
            /p:Platform="Any CPU" `
            /p:RestorePackagesPath=".\packages" `
            /m `
            /v:minimal


      # ============================================================
      # 11. 查找最终 QuickLook.exe
      # ============================================================
      - name: Find QuickLook.exe
        shell: powershell
        run: |
          Write-Host "Searching for QuickLook.exe..."

          $files = Get-ChildItem "." `
            -Recurse `
            -Filter "QuickLook.exe" `
            -File

          if ($files.Count -eq 0) {
            Write-Error "QuickLook.exe was not found."
            exit 1
          }

          foreach ($file in $files) {
            Write-Host ""
            Write-Host "Found:"
            Write-Host $file.FullName
            Write-Host "Size:"
            Write-Host $file.Length
          }


      # ============================================================
      # 12. 找到 Release 版本的 QuickLook.exe
      #     并复制到固定输出目录
      # ============================================================
      - name: Prepare artifact
        shell: powershell
        run: |
          $exe = Get-ChildItem "." `
            -Recurse `
            -Filter "QuickLook.exe" `
            -File |
            Where-Object {
              $_.FullName -match "\\bin\\Release\\"
            } |
            Select-Object -First 1

          if ($null -eq $exe) {
            Write-Error "Release QuickLook.exe was not found."
            exit 1
          }

          New-Item `
            -ItemType Directory `
            -Force `
            -Path ".\artifact" |
            Out-Null

          Copy-Item `
            $exe.FullName `
            ".\artifact\QuickLook.exe" `
            -Force

          Write-Host ""
          Write-Host "Artifact:"
          Get-Item ".\artifact\QuickLook.exe"


      # ============================================================
      # 13. 上传最终 QuickLook.exe
      # ============================================================
      - name: Upload QuickLook.exe
        uses: actions/upload-artifact@v4
        with:
          name: QuickLook-3.7.3-custom
          path: .\artifact\QuickLook.exe
          if-no-files-found: error
