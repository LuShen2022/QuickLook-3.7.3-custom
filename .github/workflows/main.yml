name: Extract ZIP to Repository

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP
        shell: powershell
        run: |
          Write-Host "Extracting QuickLook-3.7.3.zip..."

          if (Test-Path "_extracted") {
              Remove-Item "_extracted" -Recurse -Force
          }

          Expand-Archive `
            -Path "QuickLook-3.7.3.zip" `
            -DestinationPath "_extracted" `
            -Force

          Write-Host "ZIP extracted successfully."

      - name: Copy source files into repository
        shell: powershell
        run: |
          $root = (Get-Location).Path
          $extracted = Join-Path $root "_extracted"

          # ZIP 内部是 QuickLook-3.7.3\...
          $source = Join-Path $extracted "QuickLook-3.7.3"

          if (-not (Test-Path "$source\QuickLook.sln")) {
              Write-Host "QuickLook.sln not found."
              Write-Host "Extracted files:"
              Get-ChildItem $extracted -Recurse -Depth 3 |
                  Select-Object FullName
              exit 1
          }

          Write-Host "Source found at:"
          Write-Host $source

          # 逐个复制，允许与仓库已有目录合并
          Get-ChildItem $source -Force | ForEach-Object {

              $destination = Join-Path $root $_.Name

              if ($_.PSIsContainer) {
                  Write-Host "Copy directory: $($_.Name)"

                  if (-not (Test-Path $destination)) {
                      New-Item -ItemType Directory -Path $destination | Out-Null
                  }

                  Copy-Item `
                    -Path "$($_.FullName)\*" `
                    -Destination $destination `
                    -Recurse `
                    -Force `
                    -ErrorAction Stop
              }
              else {
                  Write-Host "Copy file: $($_.Name)"

                  Copy-Item `
                    -Path $_.FullName `
                    -Destination $destination `
                    -Force `
                    -ErrorAction Stop
              }
          }

          Write-Host ""
          Write-Host "Source copied successfully."

      - name: Remove temporary files
        shell: powershell
        run: |
          Remove-Item "_extracted" -Recurse -Force
          Remove-Item "QuickLook-3.7.3.zip" -Force

      - name: Commit extracted source
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          Write-Host ""
          Write-Host "Git status:"
          git status --short

          git commit -m "Extract QuickLook 3.7.3 source" `
            || Write-Host "Nothing to commit."

          git push
