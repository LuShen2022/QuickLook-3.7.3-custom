name: Extract ZIP to Repository

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP
        shell: powershell
        run: |
          Write-Host "Extracting QuickLook-3.7.3.zip..."

          if (Test-Path "QuickLook-3.7.3") {
              Remove-Item "QuickLook-3.7.3" -Recurse -Force
          }

          Expand-Archive `
            -Path "QuickLook-3.7.3.zip" `
            -DestinationPath "QuickLook-3.7.3" `
            -Force

      - name: Move files to repository root
        shell: powershell
        run: |
          $folder = "QuickLook-3.7.3"

          # 如果 ZIP 内部还有一层 QuickLook-3.7.3，
          # 就把里面的文件移动到仓库根目录。
          if (Test-Path "$folder\QuickLook-3.7.3\QuickLook.sln") {
              Write-Host "Detected nested QuickLook-3.7.3 directory."

              Get-ChildItem "$folder\QuickLook-3.7.3" -Force |
                Move-Item -Destination "." -Force

              Remove-Item "$folder" -Recurse -Force
          }

      - name: Remove ZIP
        shell: powershell
        run: |
          Remove-Item "QuickLook-3.7.3.zip" -Force

      - name: Commit extracted files
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          git status

          git commit -m "Extract QuickLook 3.7.3 source" || echo "Nothing to commit"

          git push
