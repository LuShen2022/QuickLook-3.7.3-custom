name: Build QuickLook 3.7.3

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022

    steps:
      # 1. 获取仓库源码
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      # 2. 下载 QuickLook.Common
      - name: Download QuickLook.Common
        shell: powershell
        run: |
          if (Test-Path "QuickLook.Common") {
              Remove-Item "QuickLook.Common" -Recurse -Force
          }

          git clone --depth 1 `
            https://github.com/QL-Win/QuickLook.Common.git `
            QuickLook.Common

          Write-Host "QuickLook.Common downloaded."

      # 3. 配置 MSBuild
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # 4. 检查 Windows SDK
      - name: Check Windows SDK
        shell: powershell
        run: |
          Write-Host "Windows SDK:"
          Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Lib" |
            Select-Object Name

          Write-Host ""
          Write-Host "Windows SDK References:"
          Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\References" |
            Select-Object Name

      # 5. 安装 NuGet
      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      # 6. 恢复 NuGet packages
      - name: NuGet restore
        shell: powershell
        run: |
          nuget restore QuickLook.sln

      # 7. 编译 QuickLook
      - name: Build QuickLook
        shell: powershell
        run: |
          msbuild QuickLook.sln `
            /p:Configuration=Release `
            /p:Platform="Any CPU" `
            /m

      # 8. 查找 QuickLook.exe
      - name: Check build output
        shell: powershell
        run: |
          Write-Host "Searching for QuickLook.exe..."

          $exe = Get-ChildItem `
            -Path . `
            -Filter "QuickLook.exe" `
            -Recurse `
            -File |
            Select-Object -First 1

          if ($null -eq $exe) {
              Write-Error "QuickLook.exe was not found."
              exit 1
          }

          Write-Host "Found:"
          Write-Host $exe.FullName

      # 9. 上传 QuickLook.exe
      - name: Upload QuickLook.exe
        uses: actions/upload-artifact@v4
        with:
          name: QuickLook-3.7.3-custom
          path: |
            **/QuickLook.exe
          if-no-files-found: error
