name: Build QuickLook 3.7.3

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract source ZIP
        shell: powershell
        run: |
          Write-Host "Extracting QuickLook-3.7.3.zip..."

          Expand-Archive `
            -Path "QuickLook-3.7.3.zip" `
            -DestinationPath "source" `
            -Force

          Write-Host ""
          Write-Host "Source directory:"
          Get-ChildItem "source"

      - name: Check solution
        shell: powershell
        run: |
          $solution = "source\QuickLook-3.7.3\QuickLook.sln"

          if (-not (Test-Path $solution)) {
            Write-Host "ERROR: QuickLook.sln was not found."
            Write-Host ""
            Write-Host "Files under source:"
            Get-ChildItem "source" -Recurse -Depth 3 |
              Select-Object FullName

            exit 1
          }

          Write-Host "Found solution:"
          Write-Host $solution

      - name: Get QuickLook.Common
        shell: powershell
        run: |
          $common = "source\QuickLook-3.7.3\QuickLook.Common"

          if (Test-Path $common) {
            Remove-Item $common -Recurse -Force
          }

          Write-Host "Downloading QuickLook.Common..."

          git clone --depth 1 `
            https://github.com/QL-Win/QuickLook.Common.git `
            $common

          Write-Host ""
          Write-Host "QuickLook.Common downloaded."

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages
        shell: powershell
        working-directory: source\QuickLook-3.7.3
        run: |
          nuget restore QuickLook.sln

      - name: Build QuickLook
        shell: powershell
        working-directory: source\QuickLook-3.7.3
        run: |
          msbuild QuickLook.sln `
            /m `
            /p:Configuration=Release `
            /p:Platform="Any CPU" `
            /verbosity:minimal

      - name: Find QuickLook.exe
        shell: powershell
        run: |
          Write-Host "Searching for QuickLook.exe..."

          $files = Get-ChildItem `
            -Path "source\QuickLook-3.7.3" `
            -Filter "QuickLook.exe" `
            -Recurse

          if ($files.Count -eq 0) {
            Write-Host "ERROR: QuickLook.exe was not found."
            exit 1
          }

          Write-Host ""
          Write-Host "Found QuickLook.exe:"
          $files | Select-Object FullName

      - name: Upload QuickLook.exe
        uses: actions/upload-artifact@v4
        with:
          name: QuickLook-3.7.3-custom
          path: "source/QuickLook-3.7.3/**/QuickLook.exe"
          if-no-files-found: error
